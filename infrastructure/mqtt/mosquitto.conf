# Eco-SHIELD MQTT broker (Eclipse Mosquitto) — local development configuration.
# Production: enable TLS (listener 8883 + cafile/certfile/keyfile), per-device credentials or client certificates,
# and remove anonymous access.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
